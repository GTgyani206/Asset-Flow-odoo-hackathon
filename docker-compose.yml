version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: assetflow-postgres
    environment:
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: assetflow_password
      POSTGRES_DB: assetflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetflow -d assetflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - assetflow-network

  redis:
    image: redis:7-alpine
    container_name: assetflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - assetflow-network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-39-05Z
    container_name: assetflow-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - assetflow-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  assetflow-network:
    driver: bridge
